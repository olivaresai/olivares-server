#
# A DEVELOPMENT package of the product, for building an image before the release process builds
# an image artifact. The recipe installs the product as a package
# and never by copying files into the image root, so a build that has no signed package needs
# one it can make: this is that package, and it installs exactly what the release package
# installs on Debian - the binary, the unit, the package-init note, the environment file, the
# data directory, the AppArmor profile and the licence texts, with the same depends - through the
# product's OWN postinstall.
#
# It is not a second definition of the product package and it must not become one. The release
# package is defined by .goreleaser.yaml (nfpms, package_name olivares) and is what a published
# appliance installs; when the release process builds the image artifact, build.sh takes that
# package from dist/ and this file goes away. Until then, an image built with it carries a
# product binary nobody signed, which is why no image artifact is published.
#
# The base fixtures (appliance/layer/base/fixture) install it beside olivares-appliance-base, which
# depends on olivares >= VERSION; like that package and the release recipes, it carries VERSION
# verbatim (version_schema none), so a prerelease such as 0.0.0-fixture is not rewritten to
# 0.0.0~fixture, below the constraint. Written in the JSON subset of YAML, like
# packaging/nfpm/olivares-appliance-base.yaml, so the appliance module reads it with the
# standard library. Modes are decimal: 493 = 0755,
# 420 = 0644, 416 = 0640, 488 = 0750. Built from the repository root with VERSION and ARCH in the
# environment and bin/olivares in place.
{
  "name": "olivares",
  "arch": "${ARCH}",
  "platform": "linux",
  "version": "${VERSION}",
  "version_schema": "none",
  "section": "utils",
  "priority": "optional",
  "maintainer": "Olivares.AI <enterprise@olivares.ai>",
  "description": "Ground truth for enterprise AI - open, self-hosted AI governance control plane.\nDevelopment package built for appliance image recipes; the published package comes from the\nrelease process.",
  "vendor": "Olivares.AI",
  "homepage": "https://olivares.ai",
  "license": "AGPL-3.0-only",
  "contents": [
    {"src": "bin/olivares", "dst": "/usr/bin/olivares", "file_info": {"mode": 493}},
    {"src": "bin/olivares", "dst": "/usr/libexec/olivares-container-hook", "file_info": {"mode": 493}},
    {"src": "packaging/service/migrate-agentops-dropin.sh", "dst": "/usr/share/olivares/migrate-agentops-dropin.sh", "file_info": {"mode": 493}},
    {"src": "packaging/container/session/Containerfile", "dst": "/usr/share/olivares/session-image/Containerfile", "file_info": {"mode": 420}},
    {"src": "packaging/apparmor/olivares-engine.conf", "dst": "/usr/share/olivares/apparmor/usr.bin.olivares", "packager": "deb", "file_info": {"mode": 420}},
    {"src": "packaging/systemd/olivares.service", "dst": "/usr/lib/systemd/system/olivares.service", "file_info": {"mode": 420}},
    {"src": "packaging/nfpm/package-init-systemd.txt", "dst": "/usr/lib/olivares/package-init", "file_info": {"mode": 420}},
    {"src": "packaging/olivares.env.example", "dst": "/etc/olivares/olivares.env", "type": "config|noreplace", "file_info": {"mode": 416}},
    {"dst": "/var/lib/olivares", "type": "dir", "file_info": {"mode": 488}},
    {"src": "LICENSE", "dst": "/usr/share/doc/olivares/LICENSE", "file_info": {"mode": 420}},
    {"src": "NOTICE", "dst": "/usr/share/doc/olivares/NOTICE", "file_info": {"mode": 420}},
    {"src": "LICENSING.md", "dst": "/usr/share/doc/olivares/LICENSING.md", "file_info": {"mode": 420}},
    {"src": "DISCLAIMER.md", "dst": "/usr/share/doc/olivares/DISCLAIMER.md", "file_info": {"mode": 420}}
  ],
  "scripts": {
    "postinstall": "packaging/nfpm/postinstall.sh",
    "preremove": "packaging/nfpm/preremove.sh",
    "postremove": "packaging/nfpm/postremove.sh"
  },
  "overrides": {
    "deb": {
      "depends": [
        "apparmor"
      ]
    },
    "rpm": {
      "depends": [
        "/bin/sh",
        "gawk",
        "shadow-utils",
        "coreutils",
        "sed",
        "grep"
      ]
    }
  }
}
