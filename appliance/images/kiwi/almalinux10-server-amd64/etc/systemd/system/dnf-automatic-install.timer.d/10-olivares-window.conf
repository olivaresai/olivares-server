#
# The maintenance window of the automatic security updates and of the reboot they may end with: 03:00 local time and
# up to 30 minutes after it. A night the host was off is not made up when it boots, because that run would end with a
# reboot minutes after the boot, outside the window; the next night takes it. dnf-automatic's own timer is
# OnCalendar=*-*-* 6:00 with a 60 minute delay and Persistent=true (4.20.0): the empty assignment clears the calendar and
# Persistent=false overrides the catch-up, so this is the one place the window lives. Change it with
# `systemctl edit dnf-automatic-install.timer`.
[Timer]
OnCalendar=
OnCalendar=*-*-* 03:00
RandomizedDelaySec=30min
Persistent=false
