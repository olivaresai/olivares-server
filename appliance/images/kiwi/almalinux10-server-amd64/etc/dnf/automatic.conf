#
# AlmaLinux security updates, applied by default: dnf-automatic-install.timer (enabled by the preset) runs
# `dnf-automatic --installupdates` with this file, once a day inside the reboot window of
# dnf-automatic-install.timer.d/10-olivares-window.conf. Only advisories of type security are taken, from the
# repositories that are enabled (AlmaLinux's two). The Olivares packages are excluded in [base] below, whatever
# advisory the entitled channel may publish for them (its security suite carries updateinfo), so this timer never applies a
# product release: that stays the administrator's act (olivares-appliance-update.service, which names them).
# When a transaction changed what only a reboot applies (kernel, glibc, systemd...), the host reboots at the end of
# the run, so the window is also the reboot window. The result is in the journal of dnf-automatic-install.service.
# dnf-automatic reads the options it is not given from its defaults (dnf-automatic 4.20.0: dnf.automatic.main).
[commands]
upgrade_type = security
download_updates = yes
apply_updates = yes
reboot = when-needed
reboot_command = "shutdown -r +1 'Rebooting after applying security updates'"

[emitters]
emit_via = stdio

# dnf-automatic takes dnf.conf's [main] options from this section (dnf-automatic(8)): this run alone leaves the
# product, the appliance layer and the SELinux policy to the administrator's act. dnf.conf and the update unit are untouched.
[base]
excludepkgs = olivares*
