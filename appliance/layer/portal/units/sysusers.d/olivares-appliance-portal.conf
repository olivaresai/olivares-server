# Empty admission group; package installation grants nobody membership.
g olivares-admins -
# Static identity must exist before portal activation; the service creates no account.
u olivares-portal - "Appliance Console" /nonexistent /usr/sbin/nologin
u olivares-net-guard - "Network guard" /nonexistent /usr/sbin/nologin
u olivares-netprobe - "Network probe" /nonexistent /usr/sbin/nologin
u olivares-support-bundle - "Support bundle helper" /nonexistent /usr/sbin/nologin
