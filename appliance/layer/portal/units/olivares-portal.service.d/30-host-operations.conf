# The original portal hardening and TLS delivery remain in the main unit.
# Only this private state and the receipts directory are writable by the portal.
[Unit]
After=systemd-sysusers.service systemd-tmpfiles-setup.service olivares-portal-local.socket olivares-portal-pam.socket olivares-helper-units.socket olivares-helper-storage.socket olivares-helper-firewall.socket olivares-helper-apt.socket olivares-helper-apps.socket
Requires=olivares-portal-local.socket
Wants=olivares-portal-pam.socket olivares-helper-units.socket olivares-helper-storage.socket olivares-helper-firewall.socket olivares-helper-apt.socket olivares-helper-apps.socket
StartLimitIntervalSec=10s
StartLimitBurst=5

[Service]
DynamicUser=no
User=olivares-portal
# The host-operations group, held by this account and the repair console only: systemd gives the
# StateDirectory below the unit's group, so the console's power verb reaches the operation store's
# lock. The account's own group stays supplementary for the helper sockets that admit it.
Group=olivares-operations
SupplementaryGroups=olivares-portal olivares-appliance olivares-lifecycle
# Preserve the protections that dynamic identity previously implied.
RemoveIPC=yes
PrivateTmp=yes
ProtectSystem=strict
ProtectHome=yes
RestrictSUIDSGID=yes
NoNewPrivileges=yes
RuntimeDirectory=olivares-portal-receipts
RuntimeDirectoryMode=0700
RuntimeDirectoryPreserve=no
# Root tmpfiles provisions the protected parent; only this leaf is portal-owned. 0750: the
# operations group may enter it; every record in it stays 0600 and every directory 0700.
StateDirectory=olivares-portal/operations
StateDirectoryMode=0750

# A missing mandatory credential must not cause a rapid activation loop. Direct
# restart keeps this service activating during the delay. Socket notifications
# can still rearm polling; PollLimit alone does not preserve a backoff.
# Additional start/restart producers must preserve this lifecycle contract.
Restart=on-failure
RestartMode=direct
RestartSec=15s
