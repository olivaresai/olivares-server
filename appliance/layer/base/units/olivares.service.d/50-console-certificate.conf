#
# Each start of the product pulls in the Appliance Console's certificate unit, which signs the console's
# TLS pair with the CA the product has just made or kept (olivares-console-certificate.service). Wants=,
# not Requires=: a refusal of the certificate never stops the product.
[Unit]
Wants=olivares-console-certificate.service
