[main]
plugins=keyfile
dns=default

# The container runtime owns its bridges and veth pairs. Left manageable, NetworkManager assumes them as active,
# in-memory connections, and first boot refuses those as a second network renderer (the regression).
[keyfile]
unmanaged-devices=interface-name:docker*;interface-name:br-*;interface-name:veth*
