#
# gitleaks configuration for this repository. Every default rule stays active.
[extend]
useDefault = true

# The recipe tests pin the public signing fingerprints and key-file digest of the package repositories the image
# trusts. They identify public keys and authorize nothing. Another value, path or rule remains a finding.
[[allowlists]]
  description = "recipe tests: exact public signing fingerprints and key-file digest"
  targetRules = ["generic-api-key"]
  condition = "AND"
  paths = ['''^appliance/test/test_recipe_composition\.py$''']
  regexTarget = "secret"
  regexes = [
    '''^AE27B5B818C9BCFE485B4D8B155E5EC6550A6EF8$''',
    '''^de57c3c0a2dcde88ff5b894e74335f55a0ec074815f36d472270d937c16f077b$''',
    '''^EE6DB7B98F5BF5EDD9DA0DE5DEE5C11CC2A1E572$''',
    '''^de390fc168eae5ab2852e9e93d34a0b9ddf05cf9ce90ee28d97de26a4b1f6b93$''',
    '''^7D8D15CBFC4E62688591FB2633D98517E37ED158$''',
    # Docker's release key: its fingerprint and the digest of the key file kept beside the recipe.
    '''^060A61C51B558A7F742B77AAC52FEB6B621E9F35$''',
    '''^e6c650e0700b1bf4868b693b30761b926844befc8a0acb7ac0dd9b1faf1b7423$''',
  ]
